<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid currentColor;
            opacity: 0.1;
            flex-shrink: 0;
            background: inherit;
        }

        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .code-block {
            background-color: #1e293b;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .code-block code {
            color: #e2e8f0;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .dark .code-block {
            background-color: #0f172a;
        }

        .sidebar {
            transition: transform 0.3s ease-out;
            touch-action: pan-y;
        }

        .sidebar.hidden {
            transform: translateX(-100%);
        }

        .sidebar-overlay {
            transition: opacity 0.3s ease-out;
        }

        .message-link {
            color: #3b82f6;
            text-decoration: underline;
            cursor: pointer;
        }

        .dark .message-link {
            color: #60a5fa;
        }

        .loading-dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .storage-warning {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 9999;
            font-size: 1.2rem;
            color: #64748b;
        }

        .dark #loading {
            background: #0f172a;
            color: #94a3b8;
        }

        .prose {
            max-width: 100%;
        }

        .prose p {
            margin: 0.5rem 0;
        }

        .prose ul, .prose ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .prose li {
            margin: 0.25rem 0;
        }

        .prose pre {
            margin: 0.5rem 0;
        }

        .prose blockquote {
            border-left: 3px solid #cbd5e1;
            padding-left: 1rem;
            margin-left: 0;
            color: #64748b;
        }

        .dark .prose blockquote {
            border-left-color: #475569;
            color: #94a3b8;
        }

        .swipe-indicator {
            position: absolute;
            width: 30px;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 40;
        }

        input[type="password"]::placeholder,
        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #cbd5e1;
        }

        .dark input[type="password"]::placeholder,
        .dark input[type="text"]::placeholder,
        .dark textarea::placeholder {
            color: #64748b;
        }
    </style>
</head>
<body class="bg-white text-gray-900 transition-colors duration-300">
    <div id="loading">Loading App...</div>

    <!-- Main Container -->
    <div id="app" class="hidden chat-container">
        <!-- Sidebar -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden sidebar-overlay md:hidden z-30"></div>
        <div id="sidebar" class="sidebar fixed left-0 top-0 w-64 h-screen bg-gray-100 dark:bg-slate-900 border-r border-gray-200 dark:border-slate-700 flex flex-col z-40 overflow-hidden md:relative md:translate-x-0">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-gray-200 dark:border-slate-700 flex items-center justify-between">
                <h1 class="text-lg font-bold text-gray-900 dark:text-white">Chat History</h1>
                <button id="closeSidebarBtn" class="md:hidden p-2 hover:bg-gray-200 dark:hover:bg-slate-800 rounded-lg transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- New Chat Button -->
            <button id="newChatBtn" class="m-4 py-2 px-4 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition font-medium">
                ＋ New Chat
            </button>

            <!-- Chat List -->
            <div id="chatList" class="flex-1 overflow-y-auto px-2 pb-4">
                <!-- Chats will be populated here -->
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-gray-200 dark:border-slate-700 space-y-2">
                <button id="settingsBtn" class="w-full py-2 px-4 bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-slate-700 transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Settings
                </button>
                <button id="darkModeBtn" class="w-full py-2 px-4 bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-slate-700 transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    Dark Mode
                </button>
                <div class="text-xs text-gray-500 dark:text-gray-400 text-center pt-2 pb-2 border-t border-gray-200 dark:border-slate-700">
                    <p class="font-semibold">Design & Developed By</p>
                    <p class="font-bold text-blue-500">Ayush Pandey JI</p>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col md:flex-1 w-full">
            <!-- Messages Area -->
            <div id="messagesArea" class="messages-area">
                <!-- Welcome message shown initially -->
                <div id="welcomeMessage" class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <div class="text-5xl mb-4">💬</div>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Welcome to AI Chat</h2>
                        <p class="text-gray-600 dark:text-gray-400">Start a new conversation or select an existing chat</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <form id="chatForm" class="flex gap-2">
                    <input 
                        id="chatInput" 
                        type="text" 
                        placeholder="Ask anything..." 
                        class="flex-1 px-4 py-3 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition font-medium flex items-center justify-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                        Send
                    </button>
                </form>
            </div>
        </div>

        <!-- Hamburger Menu (Mobile) -->
        <button id="hamburgerBtn" class="md:hidden fixed top-4 left-4 p-2 bg-gray-200 dark:bg-slate-800 rounded-lg z-50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Settings Modal -->
        <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 modal-backdrop p-4">
            <div class="bg-white dark:bg-slate-800 rounded-lg shadow-lg max-w-md w-full max-h-96 overflow-y-auto">
                <div class="p-6 space-y-4">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Settings</h2>

                    <!-- API Key Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">OpenRouter API Key</label>
                        <input 
                            id="apiKeyInput" 
                            type="password" 
                            placeholder="sk-or-v1-..." 
                            class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                        <button type="button" id="toggleApiKeyBtn" class="text-xs text-blue-500 mt-1 hover:underline">Show</button>
                    </div>

                    <!-- Model Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">AI Model</label>
                        <select id="modelSelect" class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free)</option>
                            <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            <option value="openai/gpt-4">GPT-4</option>
                            <option value="meta-llama/llama-2-70b-chat">Llama 2</option>
                            <option value="mistralai/mistral-7b-instruct">Mistral 7B</option>
                            <option value="custom">Custom Model</option>
                        </select>
                        <input 
                            id="customModelInput" 
                            type="text" 
                            placeholder="Enter custom model name" 
                            class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mt-2 hidden"
                        />
                    </div>

                    <!-- System Prompt -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">System Prompt (Global)</label>
                            <button type="button" id="toggleSystemPromptBtn" class="text-xs text-blue-500 hover:underline">Edit</button>
                        </div>
                        <div id="systemPromptDisplay" class="text-sm text-gray-600 dark:text-gray-400 bg-gray-100 dark:bg-slate-700 p-3 rounded max-h-24 overflow-y-auto">
                            Default system prompt active
                        </div>
                        <textarea 
                            id="systemPromptInput" 
                            placeholder="Enter system prompt for all chats..." 
                            class="w-full px-4 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mt-2 hidden resize-none h-24"
                        ></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-2 pt-4">
                        <button id="clearChatHistoryBtn" class="flex-1 py-2 px-4 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium">
                            Clear History
                        </button>
                        <button id="closeSettingsBtn" class="flex-1 py-2 px-4 bg-gray-300 dark:bg-slate-700 text-gray-900 dark:text-white rounded-lg hover:bg-gray-400 dark:hover:bg-slate-600 transition font-medium">
                            Close
                        </button>
                    </div>

                    <!-- Storage Warning -->
                    <div id="storageWarning" class="hidden bg-yellow-100 dark:bg-yellow-900 border border-yellow-400 dark:border-yellow-600 text-yellow-800 dark:text-yellow-200 px-4 py-2 rounded text-sm storage-warning">
                        ⚠️ Local storage nearing limit. Consider clearing chat history.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            DEFAULT_API_KEY: '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',
            DEFAULT_MODEL: 'deepseek/deepseek-r1:free',
            OPENROUTER_API: 'https://openrouter.ai/api/v1/chat/completions',
            DEFAULT_SYSTEM_PROMPT: 'You are a helpful, intelligent, and friendly AI assistant. Provide clear, concise, and accurate answers. Format your responses with proper markdown when appropriate.',
            STORAGE_WARNING_THRESHOLD: 9 * 1024 * 1024, // 9MB
        };

        // ==================== STATE MANAGEMENT ====================
        let state = {
            currentChatId: null,
            chats: {},
            apiKey: CONFIG.DEFAULT_API_KEY,
            model: CONFIG.DEFAULT_MODEL,
            globalSystemPrompt: CONFIG.DEFAULT_SYSTEM_PROMPT,
            darkMode: false,
            isStreaming: false,
        };

        // ==================== INITIALIZATION ====================
        function initApp() {
            loadFromStorage();
            setupEventListeners();
            renderUI();
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
            }, 300);
        }

        // ==================== STORAGE FUNCTIONS ====================
        function loadFromStorage() {
            try {
                const stored = localStorage.getItem('chatAppState');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    state = { ...state, ...parsed };
                }
                applyDarkMode();
            } catch (error) {
                console.warn('Failed to load from storage:', error);
                state.apiKey = CONFIG.DEFAULT_API_KEY;
                state.model = CONFIG.DEFAULT_MODEL;
            }
        }

        function saveToStorage() {
            try {
                const toStore = {
                    chats: state.chats,
                    currentChatId: state.currentChatId,
                    apiKey: state.apiKey,
                    model: state.model,
                    globalSystemPrompt: state.globalSystemPrompt,
                    darkMode: state.darkMode,
                };
                localStorage.setItem('chatAppState', JSON.stringify(toStore));
                checkStorageWarning();
            } catch (error) {
                console.warn('Failed to save to storage:', error);
            }
        }

        function checkStorageWarning() {
            try {
                const stored = JSON.stringify(localStorage);
                const size = new Blob([stored]).size;
                const warning = document.getElementById('storageWarning');
                if (size > CONFIG.STORAGE_WARNING_THRESHOLD && warning) {
                    warning.classList.remove('hidden');
                }
            } catch (error) {
                console.warn('Storage check failed:', error);
            }
        }

        // ==================== CHAT MANAGEMENT ====================
        function createNewChat() {
            const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            state.chats[chatId] = {
                id: chatId,
                title: 'New Chat',
                messages: [],
                systemPrompt: state.globalSystemPrompt,
                createdAt: new Date().toISOString(),
            };
            state.currentChatId = chatId;
            saveToStorage();
            renderUI();
            renderMessages();
            document.getElementById('chatInput').focus();
        }
