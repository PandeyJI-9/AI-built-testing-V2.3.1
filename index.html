<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini AI Clone | Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-sidebar { background: rgba(249, 250, 251, 0.95); backdrop-filter: blur(10px); }
        .dark .glass-sidebar { background: rgba(17, 24, 39, 0.95); }
        .message-bubble { max-width: 85%; transition: all 0.2s ease; }
        .markdown-content pre { background: #1e1e1e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
        .markdown-content code { font-family: 'Fira Code', monospace; font-size: 0.9rem; }
        .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        
        /* Mobile Specifics */
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        /* Loading Spinner */
        #loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .dark #loading-overlay { background: #111827; color: white; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

        /* Typing cursor */
        .typing::after { content: '▋'; animation: blink 1s infinite; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geminiBlue: '#1a73e8',
                        darkBg: '#131314',
                        darkSurface: '#1e1f20'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 transition-colors duration-200">

    <div id="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-geminiBlue"></div>
            <p class="font-medium animate-pulse">Initializing AI Architecture...</p>
        </div>
    </div>

    <div class="flex h-[100dvh] w-full overflow-hidden relative">
        
        <aside id="sidebar" class="fixed md:relative z-40 w-72 h-full glass-sidebar border-r border-gray-200 dark:border-gray-800 transition-transform duration-300 sidebar-closed md:translate-x-0 flex flex-col">
            <div class="p-4 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex items-center gap-3 bg-gray-200/50 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-4 py-3 rounded-full transition-all w-full font-medium">
                    <i class="fa-solid fa-plus text-geminiBlue"></i>
                    <span>New Chat</span>
                </button>
            </div>

            <div id="chat-list" class="flex-1 overflow-y-auto px-3 space-y-2">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <button onclick="toggleSettings()" class="flex items-center gap-3 w-full p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <i class="fa-solid fa-gear"></i> <span>Settings</span>
                </button>
                <button onclick="toggleTheme()" class="flex items-center gap-3 w-full p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon"></i> <span id="theme-text">Dark Mode</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <main class="flex-1 flex flex-col relative w-full overflow-hidden">
            
            <header class="h-16 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 bg-white/80 dark:bg-darkBg/80 backdrop-blur-md z-20">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h1 class="font-bold text-xl bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">Gemini 3.0</h1>
                </div>
                <div class="flex items-center gap-2">
                    <span id="current-model-badge" class="hidden md:inline-block text-xs px-2 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-md font-mono"></span>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:px-20 space-y-6 pb-32 pt-6">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center space-y-4 opacity-70">
                    <div class="text-5xl font-bold bg-gradient-to-r from-blue-400 to-pink-500 bg-clip-text text-transparent mb-4">How can I help you today?</div>
                    <p class="max-w-md text-gray-500">Ask anything. I can write code, explain science, or just chat with you.</p>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 w-full p-4 md:px-20 bg-gradient-to-t from-gray-50 dark:from-darkBg via-gray-50 dark:via-darkBg to-transparent">
                <div class="max-w-4xl mx-auto relative group">
                    <div id="input-wrapper" class="relative flex items-end gap-2 bg-white dark:bg-darkSurface border border-gray-300 dark:border-gray-700 rounded-2xl p-2 shadow-lg focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                        <textarea id="user-input" rows="1" placeholder="Enter a prompt here..." 
                            class="flex-1 bg-transparent border-none focus:ring-0 resize-none py-3 px-4 max-h-48 overflow-y-auto"
                            oninput="autoResize(this)"></textarea>
                        
                        <button id="send-btn" onclick="handleSend()" class="p-3 bg-geminiBlue text-white rounded-xl hover:opacity-90 transition-opacity disabled:opacity-50 disabled:bg-gray-400">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-center mt-2 text-gray-400">Gemini may display inaccurate info, including about people, so double-check its responses.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 hidden px-4">
        <div class="bg-white dark:bg-darkSurface w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Settings</h2>
                <button onclick="toggleSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" class="w-full bg-gray-100 dark:bg-gray-800 rounded-lg p-2.5 outline-none border border-gray-200 dark:border-gray-700">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model Selection</label>
                    <select id="model-select" class="w-full bg-gray-100 dark:bg-gray-800 rounded-lg p-2.5 outline-none border border-gray-200 dark:border-gray-700">
                        <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free)</option>
                        <option value="google/gemini-pro-1.5">Google Gemini Pro 1.5</option>
                        <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
                        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="system-prompt" rows="3" class="w-full bg-gray-100 dark:bg-gray-800 rounded-lg p-2.5 outline-none border border-gray-200 dark:border-gray-700 text-sm" placeholder="You are a helpful AI assistant..."></textarea>
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full bg-geminiBlue text-white py-3 rounded-lg font-bold hover:bg-blue-600 transition-colors">
                Save & Apply
            </button>
        </div>
    </div>

    <script>
        /** * APP CONFIG & STATE
         */
        let state = {
            chats: JSON.parse(localStorage.getItem('gemini_chats')) || [],
            activeChatId: localStorage.getItem('gemini_active_id') || null,
            settings: JSON.parse(localStorage.getItem('gemini_settings')) || {
                apiKey: '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',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: 'You are Gemini, a helpful and witty AI collaborator. Be concise but insightful.',
                theme: 'light'
            },
            isGenerating: false
        };

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatList = document.getElementById('chat-list');

        // Initialize Highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        /**
         * INITIALIZATION
         */
        window.onload = () => {
            applyTheme(state.settings.theme);
            renderChatHistory();
            if (state.activeChatId) {
                loadChat(state.activeChatId);
            }
            updateUI();
            
            // Remove Loader
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
            }, 800);

            // Handle Enter Key
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
        };

        /**
         * CORE FUNCTIONS
         */
        function updateUI() {
            document.getElementById('api-key-input').value = state.settings.apiKey;
            document.getElementById('model-select').value = state.settings.model;
            document.getElementById('system-prompt').value = state.settings.systemPrompt;
            document.getElementById('current-model-badge').innerText = state.settings.model.split('/')[1] || state.settings.model;
        }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Conversation',
                messages: [],
                timestamp: new Date()
            };
            state.chats.unshift(newChat);
            state.activeChatId = newChat.id;
            saveToStorage();
            renderChatHistory();
            loadChat(newChat.id);
            if (window.innerWidth < 768) toggleSidebar();
        }

        function loadChat(id) {
            state.activeChatId = id;
            const chat = state.chats.find(c => c.id === id);
            chatContainer.innerHTML = '';
            
            if (!chat || chat.messages.length === 0) {
                chatContainer.appendChild(document.getElementById('welcome-screen').cloneNode(true));
            } else {
                chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content, false));
            }
            
            saveToStorage();
            renderChatHistory();
        }

        function saveToStorage() {
            localStorage.setItem('gemini_chats', JSON.stringify(state.chats));
            localStorage.setItem('gemini_active_id', state.activeChatId);
            localStorage.setItem('gemini_settings', JSON.stringify(state.settings));
        }

        function renderChatHistory() {
            chatList.innerHTML = '';
            state.chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${state.activeChatId === chat.id ? 'bg-blue-100/50 dark:bg-blue-900/20 text-blue-600' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`;
                div.onclick = () => loadChat(chat.id);
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <i class="fa-regular fa-message text-sm"></i>
                        <span class="truncate text-sm font-medium">${chat.title}</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition-opacity">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                chatList.appendChild(div);
            });
        }

        function deleteChat(id) {
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.activeChatId === id) state.activeChatId = null;
            saveToStorage();
            renderChatHistory();
            loadChat(state.activeChatId);
        }

        /**
         * MESSAGE HANDLING
         */
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || state.isGenerating) return;

            // Initialize chat if none active
            if (!state.activeChatId) {
                createNewChat();
            }

            const activeChat = state.chats.find(c => c.id === state.activeChatId);
            
            // Set first message as title
            if (activeChat.messages.length === 0) {
                activeChat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
            }

            // User Message
            const userMsg = { role: 'user', content: text };
            activeChat.messages.push(userMsg);
            appendMessageUI('user', text);
            
            userInput.value = '';
            userInput.style.height = 'auto';
            state.isGenerating = true;
            toggleButtonState(true);

            // Prepare AI message placeholder
            const aiMsgContainer = appendMessageUI('assistant', '', true);
            const contentDiv = aiMsgContainer.querySelector('.markdown-content');
            
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${state.settings.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": state.settings.model,
                        "messages": [
                            { role: "system", content: state.settings.systemPrompt },
                            ...activeChat.messages
                        ],
                        "stream": true
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullAiResponse = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices && data.choices[0].delta.content) {
                                    const token = data.choices[0].delta.content;
                                    fullAiResponse += token;
                                    contentDiv.innerHTML = marked.parse(fullAiResponse);
                                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                                }
                            } catch (e) {
                                // Handle data: [DONE] or parse errors
                            }
                        }
                    }
                }

                activeChat.messages.push({ role: 'assistant', content: fullAiResponse });
                contentDiv.classList.remove('typing');
                saveToStorage();
                renderChatHistory();

            } catch (error) {
                contentDiv.innerHTML = `<span class="text-red-500">Error: ${error.message}. Please check your API key in settings.</span>`;
            } finally {
                state.isGenerating = false;
                toggleButtonState(false);
            }
        }

        function appendMessageUI(role, content, isStreaming = false) {
            // Remove welcome screen if exists
            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.remove();

            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`;
            
            const innerHtml = `
                <div class="message-bubble group relative p-4 rounded-2xl ${role === 'user' ? 'bg-geminiBlue text-white rounded-tr-none' : 'bg-white dark:bg-darkSurface border border-gray-100 dark:border-gray-800 rounded-tl-none'}">
                    <div class="markdown-content ${isStreaming ? 'typing' : ''}">
                        ${marked.parse(content || '')}
                    </div>
                    ${role === 'assistant' ? `
                        <div class="flex items-center gap-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="speakText(this)" class="p-1.5 hover:bg-gray-100 dark:
